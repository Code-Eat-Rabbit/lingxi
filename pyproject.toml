[project]
name = "lingxi-input"
version = "0.1.0"
description = "灵犀输入 — 语音转录 × AI 风格引擎"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Yutao Ma", email = "mayutao0424@163.com" },
]
keywords = ["voice-input", "speech-to-text", "style-engine", "ai", "cross-platform"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Desktop Environment",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "faster-whisper>=1.0.0",
    "funasr>=1.0.0",
    "numpy>=1.24.0",
    "PyAudio>=0.2.13",
    "sounddevice>=0.4.6",
    "pynput>=1.7.6",
    "pyautogui>=0.9.54",
    "pyperclip>=1.8.2",
    "openai>=1.30.0",
    "ollama>=0.2.0",
    "aiohttp>=3.9.0",
    "PySide6>=6.7.0",
    "psutil>=5.9.0",
    "text2emotion>=0.0.5",
    "pydantic>=2.0",
    "jieba>=0.42.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=4.0",
    "pytest-qt>=4.4",
]

[project.scripts]
lingxi = "lingxi.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["lingxi"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=4.0",
    "pytest-qt>=4.4",
]
